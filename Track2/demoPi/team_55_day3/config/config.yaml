# All paths live here. Override with COFFEE_* environment variables or CLI flags.
# ${VAR:-default} is expanded when the file is loaded.
# Relative paths are resolved from the repository root (parent of config/).
# Inside Docker, compose sets COFFEE_DATA_DIR=/data (the single bind mount).

day: ${COFFEE_DAY:-1}
seed: 42

paths:
  data_dir: ${COFFEE_DATA_DIR:-data}
  output_dir: ${COFFEE_OUTPUT_DIR:-outputs}
  model_dir: ${COFFEE_MODEL_DIR:-models}

# Class ids and submission names live in classes.yaml. This file only points at it.
registry: classes.yaml

dataset:
  train_dirname: train
  test_dirname: test
  day3_dirname: day3
  mock_dirname: mock
  samples_dirname: _sample
  layout_suffix: .layout.txt
  image_extensions: [".jpg", ".jpeg", ".png", ".bmp", ".webp"]
  # Sample filename stem, letters and digits only, lower case -> class folder.
  sample_aliases:
    good: good
    shell: shell
    black: black
    husk: husk
    broken: broken
    parchment: parchment
    immature: immature
    fullblack: black
    hull: husk
    unripe: immature

extract:
  # fastsam on the host. classical is the high-contrast fallback and the unit-test path.
  # Wood and green beans share a hue on the sample photos, so a color threshold misses them.
  backend: fastsam
  weights_name: FastSAM-s.pt
  imgsz: 640
  conf: 0.4
  min_area_frac: 0.001
  max_area_frac: 0.08
  max_aspect: 2.6
  lab_distance: 28

synth:
  images_per_class: 3
  day3_images_per_pattern: 2
  pile_beans_min: 16
  pile_beans_max: 28
  mixed_classes_min: 3
  val_fraction: 0.34
  canvas_width: 960
  canvas_height: 640

labels:
  # Only format this project reads or writes.
  # One .txt per image, same stem: class_id x1 y1 x2 y2 ... normalized polygon.
  format: yolo_seg_txt

yolo:
  weights_name: yolo26n-seg.pt
  imgsz: ${COFFEE_IMGSZ:-640}
  device: ${COFFEE_DEVICE:-0}
  epochs: 50
  batch: 8
  patience: 20
  workers: 2
  mosaic: 1.0
  close_mosaic: 10
  degrees: 15.0
  scale: 0.5
  flipud: 0.5
  fliplr: 0.5
  hsv_h: 0.0
  hsv_s: 0.2
  hsv_v: 0.2
  copy_paste: 0.3
  conf: 0.25
  iou: 0.5

ncnn:
  threads: ${COFFEE_NCNN_THREADS:-4}
  use_vulkan: false

autoencoder:
  enabled: true
  # Day 3 holdout: YOLO aware 44.65 at 1.259 s, YOLO+AE 44.02 at 1.281 s. Leave this false.
  fusion_enabled: false
  crop_size: 64
  latent_dim: 32
  epochs: 40
  batch: 32
  lr: 0.001
  val_fraction: 0.2
  knn_k: 5
  knn_share: 0.6
  low_conf: 0.45
  anomaly_quantile: 0.95
  # Second-stage fusion only reconsider these pairs, plus a high anomaly on "good".
  confusable:
    - [good, immature]
    - [good, parchment]
    - [shell, broken]
    - [black, husk]
    - [broken, immature]

infer:
  # Dataset folders and single images. No camera.
  sources: [image, folder]

day3:
  mixed_dirname: mix
  labels_filename: labels.json
  separated_dirnames:
    - dataset_TESA
    - train
  fold_count: 4
  val_fraction: 0.25
  preview_max_side: 960
  # Short baseline. Quality epochs come later. Mosaic stays off until the scorer says otherwise.
  baseline_epochs: 30
  mosaic: 0.0
  degrees: 180.0
  scale: 0.15
  roi_margin_frac: 0.15
  roi_dark_delta: 12
  roi_fallback_frac: 0.7
  # Val holdout tied at 0.05, 0.08, and 0.12. Full-16 score below is at 0.05.
  infer_conf: 0.05
  dedup_iou: 0.5
  min_area: 64
  refine: false
  s5_epochs: 40
  pile_count: 40
  pile_beans_min: 8
  pile_beans_max: 36
  pile_canvas: 1280
  team: ${COFFEE_TEAM:-team_55}
  http_base: ${COFFEE_HTTP_BASE:-}
  http_images_path: /api/v1/image
  http_submit_path: /api/v1/submit
  http_mode: ${COFFEE_HTTP_MODE:-train}
  mqtt_path: /mqtt/
  mqtt_track: EdgeAI
  mqtt_event: ${COFFEE_MQTT_EVENT:-system-testing}
  mqtt_client_id: ${COFFEE_MQTT_CLIENT_ID:-TGR-55:device-1}
  http_token: ${COFFEE_HTTP_TOKEN:-}
  http_timeout_s: 60
  http_retries: 3
  mqtt_host: ${COFFEE_MQTT_HOST:-127.0.0.1}
  mqtt_port: ${COFFEE_MQTT_PORT:-1883}
  mqtt_topic: ${COFFEE_MQTT_TOPIC:-}
  mqtt_username: ${COFFEE_MQTT_USERNAME:-}
  mqtt_password: ${COFFEE_MQTT_PASSWORD:-}
  mqtt_timeout_s: 10
  mqtt_retries: 3
